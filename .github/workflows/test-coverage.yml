name: Test Coverage Check

on:
  workflow_dispatch:
  pull_request:
    branches: 
      - feature/*

jobs:
  test:
    runs-on: ubuntu-latest

    # No postgres service: the tests start their own container through Testcontainers
    # (see PostgresTestResource), which overrides the datasource url. A service here would
    # only be an image pull and a health check that nothing ever connects to.

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2
          .m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    # Quinoa downloads its own Node and runs the Quasar build during `verify`. Both are
    # reproducible from the lockfile, so cache them rather than paying for them every run.
    - name: Cache frontend toolchain
      uses: actions/cache@v4
      with:
        path: |
          .quinoa
          src/main/webui/node_modules
        key: ${{ runner.os }}-webui-${{ hashFiles('src/main/webui/package-lock.json') }}
        restore-keys: ${{ runner.os }}-webui-

    # `verify` already runs jacoco's report (test phase) and check (verify phase), so one
    # invocation covers what used to take two.
    - name: Run tests with coverage
      run: ./mvnw clean verify

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        
