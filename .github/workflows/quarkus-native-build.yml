name: Build Quarkus Native Image (Linux & Windows) and Release

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write
  pull-requests: write

jobs:
  native-linux:
    runs-on: ubuntu-latest

    # Database for the native smoke test below (Flyway migrates it on startup)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pasa_auto
          POSTGRES_USER: pasa_ci
          POSTGRES_PASSWORD: pasa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pasa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
          components: native-image
          cache: maven

      - name: Verify GraalVM
        run: |
          java -version
          native-image --version
          mvn -version

      - name: Build Quarkus Native Image (Linux, backend only)
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
        run: |
          mvn clean package -Pnative -Dnative -DskipTests

      # The Grafana credentials go only to the running binary in the smoke test, never to the build,
      # so no artifact or installer contains them. Secrets cannot be tested in `if:`, hence this step.
      - name: Check Grafana Cloud smoke-test secrets
        id: grafana
        env:
          GRAFANA_OTLP_TOKEN: ${{ secrets.GRAFANA_OTLP_TOKEN }}
        run: |
          if [ -n "$GRAFANA_OTLP_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GRAFANA_OTLP_TOKEN is not set; skipping the Grafana Cloud export smoke test"
          fi

      - name: Smoke test native binary exporting to Grafana Cloud
        if: steps.grafana.outputs.configured == 'true'
        env:
          GRAFANA_OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
          GRAFANA_INSTANCE_ID: ${{ secrets.GRAFANA_INSTANCE_ID }}
          GRAFANA_OTLP_TOKEN: ${{ secrets.GRAFANA_OTLP_TOKEN }}
        run: |
          set -euo pipefail

          keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$keys/private.pem"
          openssl rsa -pubout -in "$keys/private.pem" -out "$keys/public.pem"

          auth=$(printf '%s:%s' "$GRAFANA_INSTANCE_ID" "$GRAFANA_OTLP_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"

          export DB_URL=jdbc:postgresql://localhost:5432/pasa_auto
          export DB_USERNAME=pasa_ci
          export DB_PASSWORD=pasa_ci
          export FLYWAY_MIGRATE_AT_START=true
          export JWT_PRIVATE_KEY="$keys/private.pem"
          export JWT_PUBLIC_KEY="$keys/public.pem"
          export LOG_PATH="$RUNNER_TEMP/app.log"
          export OTEL_SDK_DISABLED=false
          export OTEL_EXPORTER_OTLP_ENDPOINT="$GRAFANA_OTLP_ENDPOINT"
          export OTEL_EXPORTER_OTLP_HEADERS="authorization=Basic $auth"
          # Keeps smoke-test data apart from production in Grafana
          export DEPLOYMENT_ENVIRONMENT=ci
          # Production exports metrics every 60 s; the run is shorter than that
          export QUARKUS_OTEL_METRIC_EXPORT_INTERVAL=5s

          out="$RUNNER_TEMP/native-stdout.log"
          runner=$(ls target/*-runner | head -1)
          "$runner" > "$out" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$out"' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/q/health > /dev/null 2>&1; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then echo "::error::Native binary exited during startup"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/q/health
          echo

          # A traced request: 401 is expected and still produces a server span
          curl -s -o /dev/null -w "GET /api/pazaauto/barang -> %{http_code}\n" http://localhost:8080/api/pazaauto/barang

          # Span batches go out every 5 s, logs every 1 s, metrics every 5 s here; shutdown flushes the rest
          sleep 15
          kill "$pid"
          wait "$pid" || true

          if grep -q "Failed to export" "$out"; then
            grep "Failed to export" "$out" | sed 's/^/::error::/'
            exit 1
          fi
          echo "Native binary started and exported to Grafana Cloud without errors"

      - name: Upload Native Binary runner
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-native-linux
          path: target/*-runner

  native-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
          components: native-image
          cache: maven

      - name: Verify GraalVM
        run: |
          java -version
          native-image --version
          mvn -version

      - name: Build Quarkus Native Image (Windows, backend only)
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
        run: |
          mvn clean package -Pnative -Dnative -DskipTests

      - name: Prepare binary for upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path temp-bin | Out-Null
          $runnerExe = Get-ChildItem target/*-runner.exe | Select-Object -First 1
          if ($runnerExe) {
            Copy-Item -Path $runnerExe.FullName -Destination temp-bin/pasa-auto-runner.exe
            Write-Host "Prepared binary: $($runnerExe.Name) -> temp-bin/pasa-auto-runner.exe"
          } else {
            Write-Error "No runner.exe found in target/"
            exit 1
          }

      - name: Upload Native Binary runner
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-native-windows
          path: temp-bin/pasa-auto-runner.exe

  electron-windows:
    needs: native-windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Download Quarkus Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: quarkus-native-windows
          path: electron/bin/

      - name: Prepare binary for Electron
        shell: pwsh
        run: |
          # List downloaded files
          Write-Host "Downloaded contents:"
          Get-ChildItem electron/bin/ -Recurse | ForEach-Object { Write-Host $_.FullName }
          
          # Rename binary to pasa-auto-runner.exe
          $runnerExe = Get-ChildItem electron/bin/*-runner.exe | Select-Object -First 1
          if ($runnerExe) {
            Move-Item -Path $runnerExe.FullName -Destination "electron/bin/pasa-auto-runner.exe" -Force
            Write-Host "Renamed $($runnerExe.Name) to pasa-auto-runner.exe"
          } else {
            # Check if already named correctly
            if (Test-Path "electron/bin/pasa-auto-runner.exe") {
              Write-Host "pasa-auto-runner.exe already exists"
            } else {
              Write-Error "No runner.exe found in electron/bin/"
              exit 1
            }
          }
          
          # Verify
          if (Test-Path "electron/bin/pasa-auto-runner.exe") {
            Write-Host "SUCCESS: Binary ready at electron/bin/pasa-auto-runner.exe"
          } else {
            Write-Error "FAILED: Binary not found"
            exit 1
          }

      - name: Install dependencies
        working-directory: electron
        shell: pwsh
        run: |
          npm install

      - name: Build Electron App (Windows)
        working-directory: electron
        shell: pwsh
        run: |
          Write-Host "Building Electron app for Windows..."
          npm run dist:windows
          
          Write-Host "Build output:"
          Get-ChildItem dist/ | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Electron Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: |
            electron/dist/*.exe
            electron/dist/**/*.exe

  release:
    needs: [native-windows, electron-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Download Native Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: quarkus-native-windows
          path: artifacts/native-windows

      - name: Download Electron Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: electron-windows
          path: artifacts/electron-windows

      - name: Get current version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Set Git Token
        run: |
          # Always try to use PAT_TOKEN first as it's more reliable
          if [[ -n "${{ secrets.PAT_TOKEN }}" ]]; then
            echo "Using Personal Access Token"
            git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/b3kt/pasa-auto.git
          else
            echo "WARNING: No PAT_TOKEN found, using GITHUB_TOKEN (may have limited permissions)"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/b3kt/pasa-auto.git
          fi
          
          # Test authentication
          echo "Testing Git authentication..."
          git ls-remote origin >/dev/null 2>&1
          if [[ $? -ne 0 ]]; then
            echo "ERROR: Git authentication failed"
            echo "Please create a PAT_TOKEN with 'repo' scope and add it to repository secrets"
            exit 1
          else
            echo "Git authentication successful"
          fi

      - name: Make scripts executable
        run: |
          chmod +x release.sh
          chmod +x update-to-next-version.sh

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Run Version Update Script
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Running version update for version $VERSION"
          ./update-to-next-version.sh --dry-run --skip-git-check --update-release $VERSION
          ./update-to-next-version.sh --skip-git-check --update-release $VERSION

      
