# Quinoa Configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.env.files=.env
quarkus.quinoa.package-manager-install.node-version=24.11.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=/
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist/spa
# Quinoa supports a single ui-dir, so "build:all" also builds the customer portal (src/main/appui)
# and copies its bundle into dist/spa/app. Result: staff app at /, customer app at /app/
quarkus.quinoa.package-manager-command.build=run build:all
# In dev mode the same "both apps, one origin" layout is kept: "dev:all" starts the staff dev
# server (5173) and the customer portal dev server (5174), and the staff server proxies /app to it.
quarkus.quinoa.package-manager-command.dev=run dev:all
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.dev-server.enabled=true
quarkus.quinoa.dev-server.check-timeout=60000
# Quinoa only forwards an HTML response from the dev server when the request path is the root or
# ends in ".html". The customer portal is a nested SPA served under /app/, so its index HTML would
# otherwise be dropped and /app/ would 404 in dev. Direct forwarding always passes the dev server's
# response through, which is what makes http://localhost:8080/app/ work. Because direct-forwarding
# forwards *everything*, the Quarkus-owned prefixes must be excluded (the default only excludes the
# non-application root path, since the REST base path is "/"); otherwise /api, /q, /swagger-ui and
# /openapi would be shadowed by the SPA index.html served by the dev server.
quarkus.quinoa.dev-server.direct-forwarding=true
quarkus.quinoa.ignored-path-prefixes=/api,/q,/swagger-ui,/openapi

# Application Configuration
app.version=${quarkus.application.version:unknown}

# Security Configuration
# JWT Configuration
# Keys are never packaged with the application (see the pom's resource excludes): both must point at
# files outside the source tree, e.g. JWT_PRIVATE_KEY=file:/etc/pasa-auto/keys/privateKey-pkcs8.pem
# No default: without these the application refuses to start (JwtKeyConfigValidator explains
# the case where they are set but unreadable)
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY}
mp.jwt.verify.issuer=${JWT_ISSUER:https://quarkus-quasar.example.com}
jwt.issuer=${JWT_ISSUER:https://quarkus-quasar.example.com}
# Access tokens are short-lived; sessions are extended with rotating refresh tokens (revoked on logout)
jwt.expiration.minutes=${JWT_EXPIRATION_MINUTES:30}
jwt.refresh.expiration.days=${JWT_REFRESH_EXPIRATION_DAYS:7}
jwt.refresh.reuse-grace-seconds=${JWT_REFRESH_REUSE_GRACE_SECONDS:30}
# Brute-force protection for login and change-password: lock after this many failures, until
# lockout-minutes have passed since the last failure. The per-IP limit is higher for shared office connections.
app.security.login.max-failures-per-user=${LOGIN_MAX_FAILURES_PER_USER:5}
app.security.login.max-failures-per-ip=${LOGIN_MAX_FAILURES_PER_IP:20}
app.security.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}
# Customer portal plate lookups (check-nopol): distinct plates per account / per client IP per window
app.security.nopol-lookup.max-plates-per-account=${NOPOL_LOOKUP_MAX_PLATES_PER_ACCOUNT:20}
app.security.nopol-lookup.max-plates-per-ip=${NOPOL_LOOKUP_MAX_PLATES_PER_IP:60}
app.security.nopol-lookup.window-minutes=${NOPOL_LOOKUP_WINDOW_MINUTES:15}
# Fail closed: any REST endpoint without @RolesAllowed / @PermitAll / @Authenticated is denied
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${SERVER_URL:http://localhost:8080},http://localhost:9000
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
# Auth uses the Authorization header, not cookies
quarkus.http.cors.access-control-allow-credentials=false

# OpenAPI/Swagger Configuration
# Off in packaged builds: the API schema describes every endpoint and aids reconnaissance.
# These are Quarkus build-time settings, so changing them requires rebuilding, not just a restart.
quarkus.smallrye-openapi.enabled=${OPENAPI_ENABLED:false}
quarkus.smallrye-openapi.info-title=Quarkus Quasar API
quarkus.smallrye-openapi.info-version=${APP_VERSION:0.0.22-SNAPSHOT}
quarkus.smallrye-openapi.info-description=REST API for Quarkus Quasar Application
quarkus.smallrye-openapi.servers=${SERVER_URL:http://localhost:8080}
quarkus.smallrye-openapi.path=/openapi
# always-include=true is what put Swagger UI into production builds; dev mode still has it
quarkus.swagger-ui.always-include=${SWAGGER_ALWAYS_INCLUDE:false}
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Dev mode keeps the docs available without extra configuration
%dev.quarkus.smallrye-openapi.enabled=true
%dev.quarkus.swagger-ui.enabled=true

# Database Configuration (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=${DB_MAX_SIZE:10}
quarkus.datasource.jdbc.min-size=${DB_MIN_SIZE:2}

# Hibernate Configuration
quarkus.hibernate-orm.schema-management.strategy=${DB_GENERATION:validate}

# quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.enabled=true
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=false
quarkus.hibernate-orm.mapping.format.global=ignore

# Flyway Configuration
# On by default: each packaged build (server or Electron desktop) brings its own database up to date,
# otherwise schema validation stops startup at the first missing table. Set false to migrate by hand.
quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:true}
quarkus.flyway.locations=classpath:db/migration
# Validate that applied migrations still match the files shipped with this build (catches silent drift).
# If a legacy checksum mismatch blocks startup, run "flyway repair" rather than leaving this off.
quarkus.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}
quarkus.flyway.clean-disabled=true

# Repository Configuration
# Use "jpa" for database (default) or "memory" for in-memory
app.repository.type=jpa

# Caching Configuration (Caffeine)
quarkus.cache.caffeine."pelanggan-cache".expire-after-write=10M
quarkus.cache.caffeine."pelanggan-cache".maximum-size=1000
quarkus.cache.caffeine."barang-cache".expire-after-write=10M
quarkus.cache.caffeine."barang-cache".maximum-size=1000
quarkus.cache.caffeine."sparepart-cache".expire-after-write=10M
quarkus.cache.caffeine."sparepart-cache".maximum-size=1000
quarkus.cache.caffeine."jasa-cache".expire-after-write=10M
quarkus.cache.caffeine."jasa-cache".maximum-size=500
quarkus.cache.caffeine."karyawan-cache".expire-after-write=10M
quarkus.cache.caffeine."karyawan-cache".maximum-size=500
quarkus.cache.caffeine."supplier-cache".expire-after-write=10M
quarkus.cache.caffeine."supplier-cache".maximum-size=500
quarkus.cache.caffeine."kendaraan-cache".expire-after-write=10M
quarkus.cache.caffeine."kendaraan-cache".maximum-size=500
quarkus.cache.caffeine."app-settings-cache".expire-after-write=30S
quarkus.cache.caffeine."app-settings-cache".maximum-size=100

# RBAC Configuration
# Enable/disable RBAC (Role-Based Access Control) module
app.rbac.enabled=${RBAC_ENABLED:true}

# Stock Opname Integration Feature Flag
app.features.stock-integration.enabled=false

# Customer Portal Feature Flag
app.features.customer-portal.enabled=${CUSTOMER_PORTAL_ENABLED:false}

# Vehicle claim flow (customer portal)
# How a customer's claim on a plate already registered to another customer is handled:
#   APPROVAL  (default) - the claim is queued for Admin/Owner review (tb_customer_vehicle_claim_requests)
#   IMMEDIATE           - the plate is transferred to the requesting customer right away
app.customer.vehicle-claim.mode=${VEHICLE_CLAIM_MODE:APPROVAL}

# Sign in with Google
# Off by default: while disabled every /api/auth/google endpoint returns 404 and the SPA hides the button.
# The client id and secret are credentials - set them in the environment, never here.
app.auth.google.enabled=${GOOGLE_AUTH_ENABLED:false}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# Must match an authorized redirect URI registered on the Google OAuth client, and must be absolute
app.auth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
# Where the authorization code is exchanged; only overridden by tests
quarkus.rest-client.google-oauth.url=${GOOGLE_TOKEN_ENDPOINT:https://oauth2.googleapis.com}

# SSL Configuration
quarkus.http.port=${HTTP_PORT:8080}

# Reverse proxy support (off by default: the app terminates TLS itself).
# Only enable behind a proxy that overwrites X-Forwarded-For, and list its address in TRUSTED_PROXIES,
# otherwise clients can spoof their IP (used by the attendance clock-in IP allowlist).
quarkus.http.proxy.proxy-address-forwarding=${PROXY_ADDRESS_FORWARDING:false}
quarkus.http.proxy.allow-x-forwarded=${PROXY_ADDRESS_FORWARDING:false}
quarkus.http.proxy.trusted-proxies=${TRUSTED_PROXIES:127.0.0.1}


# OpenTelemetry -> Grafana Cloud (OTLP gateway). See docs/deployment.md "Observability".
#
# Build-time (fixed into the native image; an env var at runtime cannot change them, so they are
# literals here): which signals and exporters exist, the span processor and the sampler type.
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.exporter.otlp.enabled=true
# Batch processors: the simple ones export synchronously on the request thread
quarkus.otel.simple=false
quarkus.otel.traces.sampler=parentbased_traceidratio
# Spans for every SQL statement; needs io.opentelemetry.instrumentation:opentelemetry-jdbc
quarkus.datasource.jdbc.telemetry=true
#
# Runtime: telemetry is OFF unless OTEL_SDK_DISABLED=false is set, so dev, tests and desktop installs
# send nothing, and no Grafana token is ever part of the build.
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.service.name=${OTEL_SERVICE_NAME:pasa-auto}
quarkus.otel.resource.attributes=service.namespace=pasa-auto,service.version=${APP_VERSION:${quarkus.application.version}},deployment.environment=${DEPLOYMENT_ENVIRONMENT:production},deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:production}
# Fraction of new traces kept (1.0 = all); traces continued from an incoming traceparent follow the caller
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:1.0}
# Grafana Cloud accepts http/protobuf only. The base endpoint is e.g.
# https://otlp-gateway-prod-ap-southeast-1.grafana.net/otlp; /v1/traces, /v1/metrics, /v1/logs are appended.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
# "authorization=Basic <base64 of instanceId:token>" with a real space; Quarkus does not URL-decode,
# so the "Basic%20..." form from Grafana's env-var snippet is rejected with 401
quarkus.otel.exporter.otlp.headers=${OTEL_EXPORTER_OTLP_HEADERS:}
quarkus.otel.exporter.otlp.compression=gzip

# Enhanced Logging Configuration
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.enabled=true
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.path=${LOG_PATH:/tmp/app.log}
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=30
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd

# Global Log Level Configuration
quarkus.log.level=INFO

# Application log level
quarkus.log.category."com.github.b3kt".level=${APP_LOG_LEVEL:INFO}

# Request/response payload (body) logging, at INFO. Off by default: bodies can hold customer data.
# Credentials are always masked and /api/auth/* bodies are never logged. JSON bodies only.
app.logging.payload.enabled=${LOG_PAYLOAD_ENABLED:false}
# Characters kept per body; 0 logs the whole body
app.logging.payload.max-length=${LOG_PAYLOAD_MAX_LENGTH:1000}
# Extra comma-separated path prefixes whose bodies are not logged, e.g. /api/upload,/api/pazaauto/laporan
app.logging.payload.excluded-paths=${LOG_PAYLOAD_EXCLUDED_PATHS:}
quarkus.log.category."org.jboss.resteasy.reactive"=INFO
quarkus.log.category."io.opentelemetry"=INFO

# SSL Configuration - DISABLED
# quarkus.http.ssl-port=${HTTPS_PORT:443}
# quarkus.http.ssl.certificate.files=${CERT_FILE_PATH}
# quarkus.http.ssl.certificate.key-files=${KEY_FILE_PATH}
# quarkus.http.insecure-requests=${INSECURE_REQUESTS_POLICY:redirect}

# Security Headers
# Applied to every response; CSP keeps the SPA to its own origin so injected markup cannot
# load or exfiltrate through third-party hosts.
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Permissions-Policy".value=geolocation=(), microphone=(), camera=(), payment=()
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
# Only honoured over HTTPS; browsers ignore it on plain HTTP
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains

# Dev mode: Vite's HMR client needs eval and a websocket back to the dev server. The policy is sent
# through a path filter that skips Quarkus' own tools under /q/ (Dev UI, Swagger UI): Dev UI builds
# its pages from blob: modules and remote assets that an application CSP must not have to allow.
%dev.quarkus.http.header."Content-Security-Policy".path=/__csp-applied-by-dev-filter__
%dev.quarkus.http.filter.dev-csp.matches=/(?!q/).*
%dev.quarkus.http.filter.dev-csp.header."Content-Security-Policy"=default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'

# Health Check Configuration
quarkus.smallrye-health.enabled=true
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/health/ready

# Native Image Configuration
# Note: do NOT add --initialize-at-run-time=io.opentelemetry.context.LazyStorage here. Deferring that
# static initializer means native-image never resolves the ContextStorageProvider ServiceLoader entry
# during analysis, so OpenTelemetryContextStorageProvider is dropped from the image and startup dies
# with "ServiceConfigurationError: ... Provider ... not found". The quarkus-opentelemetry extension
# already sets the right initialization policy for these classes.


# Management Actuator
# Metrics (/q/metrics) and health (/q/health) are management-aware extensions, so they
# publish on the management port/host above instead of the main HTTP port once management is enabled.
quarkus.management.enabled=true
quarkus.management.host=${QUARKUS_MANAGEMENT_HOST:127.0.0.1}
quarkus.management.port=${QUARKUS_MANAGEMENT_PORT:9000}
