# Quinoa Configuration
quarkus.env.files=.env
quarkus.quinoa.package-manager-install.node-version=24.11.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=/
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist/spa
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.dev-server.enabled=true
quarkus.quinoa.dev-server.check-timeout=60000

# Application Configuration
app.version=${quarkus.application.version:unknown}

# Security Configuration
quarkus.security.users.embedded.enabled=false

# JWT Configuration
# Signing key (for generating tokens)
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY:classpath:privateKey-pkcs8.pem}
# Verification key (for validating tokens)
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:classpath:publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://quarkus-quasar.example.com}
jwt.issuer=${JWT_ISSUER:https://quarkus-quasar.example.com}
jwt.expiration.hours=2400

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${SERVER_URL:http://localhost:8080},http://localhost:9000
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# OpenAPI/Swagger Configuration
quarkus.smallrye-openapi.enabled=${OPENAPI_ENABLED:true}
quarkus.smallrye-openapi.info-title=Quarkus Quasar API
quarkus.smallrye-openapi.info-version=${APP_VERSION:0.0.22-SNAPSHOT}
quarkus.smallrye-openapi.info-description=REST API for Quarkus Quasar Application
quarkus.smallrye-openapi.servers=${SERVER_URL:http://localhost:8080}
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Database Configuration (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=${DB_MAX_SIZE:10}
quarkus.datasource.jdbc.min-size=${DB_MIN_SIZE:2}

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=${DB_GENERATION:validate}

# quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.enabled=true
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=false
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.second-level-cache.enabled=true

# Flyway Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.validate-on-migrate=true

# Repository Configuration
# Use "jpa" for database (default) or "memory" for in-memory
app.repository.type=jpa
app.security.salt=${APP_SECURITY_SALT}

# Caching Configuration (Caffeine)
quarkus.cache.caffeine."pelanggan-cache".expire-after-write=10M
quarkus.cache.caffeine."pelanggan-cache".maximum-size=1000
quarkus.cache.caffeine."barang-cache".expire-after-write=10M
quarkus.cache.caffeine."barang-cache".maximum-size=1000
quarkus.cache.caffeine."sparepart-cache".expire-after-write=10M
quarkus.cache.caffeine."sparepart-cache".maximum-size=1000
quarkus.cache.caffeine."jasa-cache".expire-after-write=10M
quarkus.cache.caffeine."jasa-cache".maximum-size=500
quarkus.cache.caffeine."karyawan-cache".expire-after-write=10M
quarkus.cache.caffeine."karyawan-cache".maximum-size=500
quarkus.cache.caffeine."supplier-cache".expire-after-write=10M
quarkus.cache.caffeine."supplier-cache".maximum-size=500
quarkus.cache.caffeine."kendaraan-cache".expire-after-write=10M
quarkus.cache.caffeine."kendaraan-cache".maximum-size=500

# Rate Limiting Configuration
quarkus.smallrye-rate-limiter.enabled=true
# Default rate limit: 100 requests per minute per IP
quarkus.smallrye-rate-limiter.default-limit=100
quarkus.smallrye-rate-limiter.default-window=60s

# RBAC Configuration
# Enable/disable RBAC (Role-Based Access Control) module
app.rbac.enabled=${RBAC_ENABLED:true}

# Stock Opname Integration Feature Flag
app.features.stock-integration.enabled=false

# SSL Configuration
quarkus.http.port=${HTTP_PORT:8080}


# OpenTelemetry Configuration
quarkus.otel.simple=${OTEL_SIMPLE:true}
quarkus.otel.enabled=${OTEL_ENABLED:true}
quarkus.otel.logs.enabled=${OTEL_LOGS_ENABLED:true}
quarkus.otel.metrics.enabled=${OTEL_METRICS_ENABLED:true}
quarkus.otel.traces.enabled=${OTEL_TRACES_ENABLED:true}
quarkus.otel.traces.exporter=${OTEL_TRACES_EXPORTER:cdi}
quarkus.otel.metrics.exporter=${OTEL_METRICS_EXPORTER:cdi}
quarkus.otel.logs.exporter=${OTEL_LOGS_EXPORTER:cdi}
quarkus.otel.log.injection.enabled=${OTEL_LOG_INJECTION_ENABLED:true}
quarkus.otel.service.name=${OTEL_SERVICE_NAME:pasa-auto}
quarkus.otel.resource.attributes=deployment.environment=production,service.namespace=pasa-auto,service.version=${APP_VERSION:0.0.31}
quarkus.otel.sampler=${OTEL_SAMPLER:on}
quarkus.otel.sampler.argument=${OTEL_SAMPLER_ARGUMENT:0.5}
quarkus.otel.exporter.otlp.enabled=${OTEL_EXPORTER_OTLP_ENABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:https://api.uptrace.dev:4317}
quarkus.otel.exporter.otlp.headers=uptrace-dsn=${UPTRACE_DSN}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}

# Enhanced Logging Configuration
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.path=${LOG_PATH:./app.log}
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=30
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd

# Global Log Level Configuration
quarkus.log.level=INFO

# Request/Response Logging (keep at INFO level)
quarkus.log.category."com.github.b3kt".level=DEBUG
quarkus.log.category."org.jboss.resteasy.reactive".level=INFO
quarkus.log.category."io.opentelemetry".level=INFO

